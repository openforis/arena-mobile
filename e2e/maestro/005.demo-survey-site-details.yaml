appId: ${APP_ID}
---
# Demo survey (bundled, no login): hierarchical code attributes, GPS coordinate,
# calculated attributes, multiple attribute and enumerated entity
- runFlow: common/demo-survey-new-record.yaml
- runFlow:
    file: common/open-page.yaml
    env:
      PAGE: "Site Details"

# hierarchical code attributes: district items depend on the selected region
- tapOn:
    text: "Select item"
    below: "Region"
    index: 0
- tapOn: "Central Region.*"
- tapOn:
    text: "Select item"
    below: "District"
    index: 0
- assertVisible: "Plateau District.*"
- assertNotVisible: "Coastal District.*"
- tapOn: "Plateau District.*"
- assertVisible: "Plateau District \\(3\\)"

# coordinate from device GPS (~106 m north of the provided location of Test Point 1)
- setLocation:
    latitude: 3.9768
    longitude: 42.10738
- tapOn: "Get location"
- extendedWaitUntil:
    visible: "3\\.9768"
    timeout: 20000
# calculated attribute: distance(unit_location_given, site_location)
- scrollUntilVisible:
    element: "Distance from provided location \\[m\\]"
    direction: DOWN
- assertVisible: "10[0-9](\\.[0-9]+)?"

# integer attribute with validation (error range + warning when > 60)
- scrollUntilVisible:
    element:
      id: "site_slope"
    direction: DOWN
- tapOn:
    id: "site_slope"
- inputText: "75"
- tapOn: "Slope \\[%\\]"
- assertVisible: "75"

# code attribute rendered as radio buttons (applicable only if slope > 0)
- scrollUntilVisible:
    element: "North-East \\(NE\\)"
    direction: DOWN
- tapOn: "North-East \\(NE\\)"

# multiple text attribute (capitalized)
- scrollUntilVisible:
    element: "New Observers"
    direction: DOWN
- tapOn:
    id: "site_observers"
    index: 0
- inputText: "ann"
- tapOn: "Observers"
- tapOn: "New Observers"
- tapOn:
    id: "site_observers"
    index: 1
- inputText: "bob"
- tapOn: "Observers"
- assertVisible: "Ann"
- assertVisible: "Bob"

# enumerated entity: one row for each ground cover class is created automatically
- scrollUntilVisible:
    element: "Edit Ground cover"
    direction: DOWN
- tapOn: "Edit Ground cover"
- assertVisible: "Trees"
- assertVisible: "Shrubs"
- assertVisible: "Litter"
- assertNotVisible: "New Ground cover"
- tapOn: "Trees"
- tapOn:
    id: "ground_cover_percent"
- inputText: "40"
- tapOn: "Cover \\[%\\]"
- runFlow: common/dismiss-dev-notifications.yaml
- tapOn: "Ground cover\\[2\\]"
- assertVisible: "Shrubs"
- tapOn:
    id: "ground_cover_percent"
- inputText: "60"
- tapOn: "Cover \\[%\\]"
# back to Site Details (breadcrumb): the total is calculated with sum(ground_cover.ground_cover_percent)
- tapOn: "Site Details"
- scrollUntilVisible:
    element: "Total ground cover \\[%\\]"
    direction: DOWN
- assertVisible: "100"
