appId: ${APP_ID}
---
- tapOn:
    id: "home-connect-button"
# the server URL panel is below the login form
- scrollUntilVisible:
    element: "Server URL"
# the panel opens by itself when a custom server URL was used before:
# select Default to reset the field to the default URL (this collapses the panel)
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Default"
    commands:
      - tapOn: "Default"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Custom"
    commands:
      - tapOn: "Server URL"
- tapOn: "Custom"
- tapOn:
    id: "remote-connection-server-url-input"
    waitToSettleTimeoutMs: 1000
# eraseText deletes before the cursor: move it to the end of the text first
- pressKey: Remote Dpad Down
- eraseText
- inputText: ${ARENA_SERVER_URL}

# the keyboard scrolls the screen to the server URL field, hiding the email field
- scrollUntilVisible:
    element: "Email"
    direction: UP
- tapOn: "Email"
- inputText: ${ARENA_SERVER_USERNAME}

- tapOn: "Password"
- inputText: ${ARENA_SERVER_PASSWORD}

# workaround: the first tap may only hide the keyboard
- tapOn:
    id: "remote-connection-login-button"
- tapOn:
    id: "remote-connection-login-button"
    optional: true

- extendedWaitUntil:
    visible: "Login successful!"
    timeout: 20000

- tapOn: "Continue"
