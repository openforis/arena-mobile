appId: ${APP_ID}
---
- tapOn:
    id: "home-connect-button"
# the server URL panel is below the login form. scrollUntilVisible swipes from the screen center, a drag
# that doesn't scroll the form when it starts on a text field: swipe from the "Go back" button first
- runFlow:
    when:
      notVisible: "Server URL"
    commands:
      - swipe:
          from:
            text: "Go back"
          direction: UP
- scrollUntilVisible:
    element: "Server URL"
# the panel opens by itself when a custom server URL was used before:
# select Default to reset the field to the default URL (this collapses the panel)
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Default"
    commands:
      - tapOn: "Default"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Custom"
    commands:
      - tapOn: "Server URL"
# the create account banner at the top pushes the panel below the screen on small devices
- runFlow:
    when:
      notVisible: "Custom"
    commands:
      - swipe:
          from:
            text: "Go back"
          direction: UP
- scrollUntilVisible:
    element: "Custom"
- tapOn: "Custom"
# the create account banner at the top pushes the field below the screen on small devices
- runFlow:
    when:
      notVisible:
        id: "remote-connection-server-url-input"
    commands:
      - swipe:
          from:
            text: "Go back"
          direction: UP
- scrollUntilVisible:
    element:
      id: "remote-connection-server-url-input"
- tapOn:
    id: "remote-connection-server-url-input"
    waitToSettleTimeoutMs: 1000
# eraseText deletes before the cursor: move it to the end of the text first
- pressKey: Remote Dpad Down
- eraseText
- inputText: ${ARENA_SERVER_URL}

# the keyboard scrolls the screen to the server URL field, hiding the email field:
# hide it, then scroll back up from the "Go back" button (see above)
- hideKeyboard
- runFlow:
    when:
      notVisible: "Email"
    commands:
      - swipe:
          from:
            text: "Go back"
          direction: DOWN
- scrollUntilVisible:
    element: "Email"
    direction: UP
- tapOn: "Email"
- inputText: ${ARENA_SERVER_USERNAME}

- tapOn: "Password"
- inputText: ${ARENA_SERVER_PASSWORD}

# the keyboard can cover the login button (pushed down by the create account banner)
- hideKeyboard
- runFlow:
    when:
      notVisible:
        id: "remote-connection-login-button"
    commands:
      - swipe:
          from:
            text: "Forgot password?"
          direction: UP
- scrollUntilVisible:
    element:
      id: "remote-connection-login-button"
- tapOn:
    id: "remote-connection-login-button"

- extendedWaitUntil:
    visible: "Login successful!"
    timeout: 20000

- tapOn: "Continue"
