appId: ${APP_ID}
---
# the survey banner can push the Surveys item below the fold on small screens
- scrollUntilVisible:
    element:
      id: "home-surveys-button"
- tapOn:
    id: "home-surveys-button"
- tapOn: "Import from cloud"
- tapOn: "arena_demo"
- tapOn:
    text: "Import survey|Update survey"
- extendedWaitUntil:
    visible: "Records"
    timeout: 20000
- extendedWaitUntil:
    visible: "No records found"
    timeout: 5000
