appId: ${APP_ID}
---
# Opens a record from the list of records. Params: RECORD (text of its row)
# "Continue editing" dialog, shown when the record was left on a page other than the first one: No
- tapOn: ${RECORD}
- extendedWaitUntil:
    visible:
      id: "confirm-dialog-title"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "confirm-dialog-title"
    commands:
      - tapOn:
          id: "confirm-dialog-cancel-button"
- waitForAnimationToEnd
