appId: ${APP_ID}
---
- runFlow: _init.yaml
- runFlow:
    file: _shot.yaml
    env:
      NAME: home-with-records
- runFlow: _go-to-data-entry.yaml
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-list
- tapOn:
    id: "app-bar-screen-view-mode-button"
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-list-cards
- tapOn:
    id: "app-bar-screen-view-mode-button"
- tapOn: ${output.t.options}
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-options
- tapOn: ${output.t.options}
- longPressOn: "Test Point 1.*"
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-selected
- back
