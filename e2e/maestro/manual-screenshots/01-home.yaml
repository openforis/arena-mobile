appId: ${APP_ID}
---
- runFlow: _init.yaml
- runFlow:
    file: _shot.yaml
    env:
      NAME: home
- tapOn:
    id: "app-bar-options-menu-button"
- runFlow:
    file: _shot.yaml
    env:
      NAME: options-menu
# close the menu tapping outside it (back would close the app)
- tapOn:
    point: "30%,80%"
- tapOn:
    id: "home-connect-button"
- runFlow:
    file: _shot.yaml
    env:
      NAME: login
- scrollUntilVisible:
    element: ${output.t.login}
    optional: true
- runFlow:
    file: _shot.yaml
    env:
      NAME: login-2
