appId: ${APP_ID}
---
- runFlow: _init.yaml
- runFlow: _go-to-data-entry.yaml
- tapOn:
    id: "app-bar-records-map-button"
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-map-chooser
- tapOn:
    text: ${output.t.freeMapLayers}
    optional: true
- tapOn: ${output.t.showMap}
- runFlow:
    file: _wait.yaml
    env:
      SECONDS: 15
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-map
- tapOn:
    id: "records-map-layers-button"
- runFlow:
    file: _shot.yaml
    env:
      NAME: records-map-layers
