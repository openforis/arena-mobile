appId: ${APP_ID}
---
# Opens the list of records from the home screen.
# The "Continue editing" dialog is shown when a record was being edited when the app was closed: dismissed
- tapOn: ${output.t.goToDataEntry}
- waitForAnimationToEnd
# the dialog is shown after the list of records
- extendedWaitUntil:
    visible: ${output.t.continueEditingTitle}
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: ${output.t.continueEditingTitle}
    commands:
      - tapOn: ${output.t.no}
      - waitForAnimationToEnd
