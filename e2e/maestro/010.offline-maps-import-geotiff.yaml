appId: ${APP_ID}
---
# Offline maps: import of a GeoTIFF map (e2e/maestro/assets/geotiff-test-map.tif, generated by
# assets/generate_geotiffs.py; e2e/scripts/run-maestro-android.sh copies it to the Download folder)
- launchApp:
    stopApp: true
- runFlow: common/dismiss-whats-new.yaml
- tapOn:
    id: "app-bar-options-menu-button"
- tapOn: "Offline maps"
- tapOn: "Imported maps"
- tapOn: "Import map"

# system file picker: the file can be already listed in the recent files
- extendedWaitUntil:
    visible: "geotiff-test-map.tif|Show roots"
    timeout: 30000
- runFlow:
    when:
      notVisible: "geotiff-test-map.tif"
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
- tapOn: "geotiff-test-map.tif"

# import screen: georeference read, preview rendered by the native module
- extendedWaitUntil:
    visible: "Max zoom: .*"
    timeout: 60000
- extendedWaitUntil:
    visible: "Preview at low resolution.*"
    timeout: 120000
- assertNotVisible: "Preview not available.*"
- takeScreenshot: GeoTiffImportPreview
- tapOn: "Import"

# back to the list of imported maps (the default name is the file name)
- extendedWaitUntil:
    visible: "geotiff-test-map"
    timeout: 180000
- assertVisible: "Zoom levels: .*"
- assertNotVisible: "Page: .*"
- takeScreenshot: GeoTiffImported
