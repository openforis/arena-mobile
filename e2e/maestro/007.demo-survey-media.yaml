appId: ${APP_ID}
---
# Demo survey (bundled, no login): file attributes (image, video, audio, other)
- addMedia:
    - assets/sample-photo.jpg
- runFlow: common/demo-survey-new-record.yaml
- runFlow:
    file: common/open-page.yaml
    env:
      PAGE: "Media and Documents"

# image file attribute: pick the sample photo from the system photo picker
- assertVisible: "Site photo"
- tapOn:
    text: "Select picture"
    index: 0
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 20000
- tapOn:
    text: "Photo taken on.*"
    index: 0
- extendedWaitUntil:
    visible: "Rotate"
    timeout: 20000

- assertVisible: "Site video"
- assertVisible: "Select video"

# audio file attribute applicable only when consent is given
- scrollUntilVisible:
    element: "Supporting document"
    direction: DOWN
- assertNotVisible: "Interview audio recording"
- tapOn: "Yes"
- scrollUntilVisible:
    element: "Interview audio recording"
    direction: DOWN
- assertVisible: "Select audio"
- tapOn: "No"
- assertNotVisible: "Interview audio recording"

# other file type
- scrollUntilVisible:
    element: "Select file"
    direction: DOWN
- assertVisible: "Supporting document"
