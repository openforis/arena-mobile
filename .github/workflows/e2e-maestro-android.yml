name: E2E Maestro Android

on: [pull_request]

jobs:
  e2e-tests-maestro-android:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          always-auth: true
          auth-token: ${{secrets.ACCESS_TOKEN}}
          registry-url: "https://npm.pkg.github.com"
          scope: "@openforis"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # Build the APK FIRST (No emulator yet)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Cache Expo prebuild output
        uses: actions/cache@v4
        id: cache-android-prebuild
        with:
          path: android/
          key: android-prebuild-${{ hashFiles('package.json', 'yarn.lock', 'app.config.ts') }}

      - name: Build Android APK
        run: |
          if [ "${{ steps.cache-android-prebuild.outputs.cache-hit }}" != "true" ]; then
            npx expo prebuild --platform android
          fi

          # Manually create the bundle and assets folder
          mkdir -p android/app/src/main/assets

          # Manually bundle the JS into the assets folder
          npx expo export:embed \
           --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          cd android
          ./gradlew assembleDebug --no-daemon --build-cache --parallel
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ARENA_SERVER_URL: ${{secrets.ARENA_SERVER_URL}}
          ARENA_SERVER_USERNAME: ${{secrets.ARENA_SERVER_USERNAME}}
          ARENA_SERVER_PASSWORD: ${{secrets.ARENA_SERVER_PASSWORD}}
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -accel on -cores 2 -memory 3072
          disable-animations: true
          # Increase timeout because software-rendering is slow
          emulator-boot-timeout: 900
          script: bash e2e/scripts/run-maestro-android.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: ~/.maestro/tests/**/*

      - name: Store tests result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e_android_report
          path: |
            report.xml
