name: Web preview release asset

# Builds the web preview of the app (served by Arena under /mobile-preview, see the Arena survey designer)
# and attaches it to the GitHub release as arena-mobile-web-preview.zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release (e.g. v2.10.0)
        required: true

jobs:
  web-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        # no dependency needs lifecycle (install/postinstall) scripts: skip them
        run: yarn install --immutable --mode=skip-build

      - name: Build web preview
        env:
          WEB_BASE_URL: /mobile-preview
        run: yarn build:web

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist-web && zip -qr ../arena-mobile-web-preview.zip .)
          gh release upload "$TAG" arena-mobile-web-preview.zip --clobber --repo "$GITHUB_REPOSITORY"
