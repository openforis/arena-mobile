name: User manual

# Generates the user manual (.docx and .pdf) from docs/user-manual:
# - pull requests changing it: uploaded as workflow artifact, to check the result
# - published releases: attached to the release; the latest one is always available at
#   https://github.com/openforis/arena-mobile/releases/latest/download/arena-mobile-user-manual.pdf

on:
  pull_request:
    paths:
      - docs/user-manual/**
      - .github/workflows/user-manual.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release (e.g. v2.11.0)
        required: true

jobs:
  user-manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install pandoc and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer python3-uno fonts-crosextra-carlito

      - name: Generate user manual
        env:
          PYTHON: /usr/bin/python3
        run: bash docs/user-manual/scripts/build.sh

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: user-manual
          path: |
            docs/user-manual/arena-mobile-user-manual.docx
            docs/user-manual/arena-mobile-user-manual.pdf

      - name: Upload release assets
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            docs/user-manual/arena-mobile-user-manual.docx \
            docs/user-manual/arena-mobile-user-manual.pdf \
            --clobber --repo "$GITHUB_REPOSITORY"
