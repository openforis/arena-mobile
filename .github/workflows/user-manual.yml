name: User manual

# Generates the user manual PDFs (English, French, Spanish) from docs/user-manual/arena-mobile-user-manual.docx
# (French and Spanish: translated with docs/user-manual/translations, see docs/user-manual/README.md):
# - pull requests changing it: uploaded as workflow artifact, to check the result
# - published releases: attached to the release and published on GitHub Pages (open in the browser):
#   https://openforis.github.io/arena-mobile/arena-mobile-user-manual.pdf
#   https://openforis.github.io/arena-mobile/arena-mobile-user-manual-fr.pdf
#   https://openforis.github.io/arena-mobile/arena-mobile-user-manual-es.pdf

on:
  pull_request:
    paths:
      - docs/user-manual/**
      - .github/workflows/user-manual.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release (e.g. v2.11.0)
        required: true

jobs:
  user-manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno python3-lxml python3-pil fonts-crosextra-carlito

      - name: Generate user manual
        env:
          PYTHON: /usr/bin/python3
          SEGMENTS_PYTHON: /usr/bin/python3
        run: bash docs/user-manual/scripts/build.sh

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: user-manual
          path: docs/user-manual/arena-mobile-user-manual*.pdf

      - name: Upload release assets
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            docs/user-manual/arena-mobile-user-manual*.pdf \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Prepare GitHub Pages content
        if: env.TAG != ''
        run: |
          mkdir -p pages
          cp docs/user-manual/arena-mobile-user-manual*.pdf pages/

      - name: Upload GitHub Pages artifact
        if: env.TAG != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  pages:
    needs: user-manual
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}arena-mobile-user-manual.pdf
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
